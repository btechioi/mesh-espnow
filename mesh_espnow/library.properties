name=ESP-NOW Mesh Network Library v3
version=3.0.0
author=Various contributors
maintainer=Various contributors
sentence=Intelligent, metric-based self-forming/self-healing mesh for ESP32 — no Wi-Fi infrastructure, no IP stack, no ESP-MESH.
paragraph=Features intelligent routing with composite metrics, multi-path (primary + backup), battery-aware operation, AES-128-CCM encryption, reliable ACK-based delivery, deep sleep support (~14uA idle), health monitoring, and 1000+ node scaling. Works with ESP-NOW only — no router, no IP, no ESP-MESH dependency.
category=Communication
